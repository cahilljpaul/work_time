<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://hjhjavwpwjksjhxgsqns.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Week Planner</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<header>
  <h1>Week Planner</h1>
  <div class="bank" id="bank"></div>
</header>
<div class="modes"><button data-view="work">Calendar</button><button data-view="free">Free time / projects</button></div>

<details class="card" id="settingsBox">
  <summary>Settings</summary>
  <div class="grid">
    <label>Hours per day <input type="number" id="hours" step="0.25" min="0"></label>
    <label>Lunch (min) <input type="number" id="lunch" step="5" min="0"></label>
    <label>Usual start <input type="time" id="start"></label>
    <label>Usual finish <input type="time" id="finish"></label>
    <label>Usual lunch time <input type="time" id="lunchAt"></label>
    <label>Bedtime <input type="time" id="sleepAt"></label>
    <label>Wake up <input type="time" id="wakeAt"></label>
    <label>Normal commute (min, one way) <input type="number" id="commute" step="5" min="0"></label>
  </div>
  <label style="flex-direction:row;align-items:center;gap:6px;margin-top:10px"><input type="checkbox" id="exact" style="width:auto"> Exact minutes (otherwise times step by 15 min)</label>
  <p class="hint">Travel to an alternative office: anything over your normal commute is added to your time bank.</p>
</details>

<nav class="weeknav">
  <button id="prev">&larr;</button>
  <strong id="weekLabel"></strong>
  <button id="next">&rarr;</button>
  <button id="today">Today</button>
</nav>

<main id="days"></main>

<section class="card">
  <div id="summary"></div>
  <div class="hint" style="margin:0 0 4px">Export this week to your calendar (.ics):</div>
  <div id="exportOpts" class="chips" style="margin-bottom:10px"></div>
  <button id="ics" class="primary">Export selected to calendar (.ics)</button>
  <button id="reset" class="ghost">Clear this week</button>
</section>

<details class="card" id="acctBox">
  <summary>Account &amp; sync</summary>
  <div id="account" class="acct"></div>
  <div id="shares"></div>
  <p class="hint" id="acctMsg">Sign in to save your weeks online and use them on any device.</p>
</details>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="app.js?v=10"></script>
<script src="sync.js?v=10"></script>
</body>
</html>
